<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">온톨로지 그래프를 PPO 상태 표현으로 사용하는 전체 파이프라인</title>
  <desc id="desc">센서 관측을 의미 노드 특징으로 바꾸고 관계형 그래프 어텐션과 그래프 readout을 거쳐 Actor와 Critic에 전달하며 PPO 손실이 R-GAT까지 역전파되는 과정</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrow-grad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 700 32px 'Segoe UI', 'Noto Sans KR', sans-serif; fill: #0f172a; }
      .subtitle { font: 400 18px 'Segoe UI', 'Noto Sans KR', sans-serif; fill: #475569; }
      .label { font: 700 19px 'Segoe UI', 'Noto Sans KR', sans-serif; fill: #0f172a; text-anchor: middle; }
      .small { font: 400 15px 'Segoe UI', 'Noto Sans KR', sans-serif; fill: #475569; text-anchor: middle; }
      .group { font: 700 16px 'Segoe UI', 'Noto Sans KR', sans-serif; fill: #475569; letter-spacing: 1px; }
      .edge { fill: none; stroke: #475569; stroke-width: 3; marker-end: url(#arrow); }
      .grad { fill: none; stroke: #dc2626; stroke-width: 3; stroke-dasharray: 9 7; marker-end: url(#arrow-grad); }
      .edge-label { font: 600 14px 'Segoe UI', 'Noto Sans KR', sans-serif; fill: #475569; }
    </style>
  </defs>

  <rect width="1600" height="760" fill="#f8fafc"/>
  <text x="800" y="52" class="title" text-anchor="middle">Ontology Graph State → PPO Actor–Critic</text>
  <text x="800" y="83" class="subtitle" text-anchor="middle">온톨로지는 보상을 바꾸지 않고, 동일한 관측을 구조화된 상태 표현으로 변환합니다.</text>

  <text x="45" y="125" class="group">OBSERVATION</text>
  <text x="455" y="125" class="group">ONTOLOGY STATE</text>
  <text x="725" y="125" class="group">RELATIONAL ENCODER</text>
  <text x="1190" y="125" class="group">GRAPH STATE</text>

  <g filter="url(#shadow)">
    <rect x="45" y="150" width="210" height="122" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="150" y="190" class="label">센서 관측 + 기억</text>
    <text x="150" y="222" class="small">11D observation oₜ</text>
    <text x="150" y="247" class="small">visible · error · velocity · mode</text>

    <rect x="305" y="150" width="210" height="122" rx="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <text x="410" y="190" class="label">의미 채널</text>
    <text x="410" y="222" class="small">observationSemantics</text>
    <text x="410" y="247" class="small">크기 vᵢ,ₜ + 방향 dᵢ,ₜ</text>

    <rect x="565" y="150" width="220" height="122" rx="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="675" y="187" class="label">상황 그래프 Gₜ</text>
    <text x="675" y="219" class="small">9 nodes · 22 typed edges</text>
    <text x="675" y="244" class="small">Xₜ ∈ ℝ¹⁴ˣ⁹</text>

    <rect x="835" y="150" width="220" height="122" rx="18" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
    <text x="945" y="185" class="label">2-layer R-GAT</text>
    <text x="945" y="217" class="small">relation-specific attention</text>
    <text x="945" y="242" class="small">2nd layer + residual</text>

    <rect x="1105" y="150" width="205" height="122" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="1207" y="187" class="label">Graph readout</text>
    <text x="1207" y="219" class="small">mean(Hₜ) ∥ max(Hₜ)</text>
    <text x="1207" y="244" class="small">tanh projection</text>

    <rect x="1360" y="164" width="170" height="94" rx="47" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
    <text x="1445" y="204" class="label">graph state</text>
    <text x="1445" y="234" class="small">gₜ</text>
  </g>

  <path class="edge" d="M255 211 L305 211"/>
  <path class="edge" d="M515 211 L565 211"/>
  <path class="edge" d="M785 211 L835 211"/>
  <path class="edge" d="M1055 211 L1105 211"/>
  <path class="edge" d="M1310 211 L1360 211"/>

  <g filter="url(#shadow)">
    <rect x="1110" y="365" width="210" height="105" rx="18" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
    <text x="1215" y="405" class="label">Actor πθ</text>
    <text x="1215" y="438" class="small">μₜ, σ → uₜ ~ 𝒩</text>

    <rect x="1110" y="520" width="210" height="105" rx="18" fill="#fef3c7" stroke="#ca8a04" stroke-width="2"/>
    <text x="1215" y="560" class="label">Critic Vψ</text>
    <text x="1215" y="593" class="small">state value V(gₜ)</text>

    <rect x="1370" y="365" width="175" height="105" rx="18" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="1457" y="403" class="label">가속도 명령</text>
    <text x="1457" y="436" class="small">aₓ, a_z [m/s²]</text>

    <rect x="750" y="520" width="250" height="105" rx="18" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
    <text x="875" y="560" class="label">UGV 착륙 환경</text>
    <text x="875" y="593" class="small">센서 · 동역학 · 접촉 판정</text>

    <rect x="455" y="520" width="230" height="105" rx="18" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
    <text x="570" y="558" class="label">동일한 보상</text>
    <text x="570" y="589" class="small">capture + distance</text>

    <rect x="115" y="500" width="260" height="145" rx="20" fill="#fff7ed" stroke="#f97316" stroke-width="3"/>
    <text x="245" y="544" class="label">PPO objective</text>
    <text x="245" y="577" class="small">clipped policy loss</text>
    <text x="245" y="603" class="small">+ value loss + entropy</text>
  </g>

  <path class="edge" d="M1445 258 C1445 315 1320 315 1250 365"/>
  <path class="edge" d="M1445 258 C1445 475 1370 520 1320 560"/>
  <path class="edge" d="M1320 417 L1370 417"/>
  <path class="edge" d="M1370 455 C1270 490 1110 535 1000 565"/>
  <path class="edge" d="M750 572 L685 572"/>
  <path class="edge" d="M455 572 L375 572"/>
  <path class="edge" d="M750 545 C535 390 185 370 150 272"/>
  <text x="400" y="401" class="edge-label">next observation</text>

  <path class="grad" d="M375 530 C620 410 900 405 1110 417"/>
  <path class="grad" d="M375 590 C650 690 940 680 1110 590"/>
  <path class="grad" d="M245 500 C280 330 750 325 945 272"/>
  <text x="650" y="344" class="edge-label" fill="#dc2626">PPO gradient updates Actor, Critic, readout and both R-GAT layers</text>

  <rect x="45" y="690" width="1510" height="46" rx="12" fill="#f1f5f9"/>
  <text x="800" y="720" class="subtitle" text-anchor="middle">고정: 노드·관계 스키마  |  학습: 관계별 메시지, attention, graph readout, Actor, Critic  |  동일: 보상·행동·환경</text>
</svg>
