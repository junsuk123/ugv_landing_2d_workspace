  <text x="1180" y="540" text-anchor="middle" class="t s">7 nodes × 6 channels · 4 relations · 16 edges</text>
  <text x="1180" y="578" text-anchor="middle" class="t s">Typed attention → factorized grouped readout (16)</text>
