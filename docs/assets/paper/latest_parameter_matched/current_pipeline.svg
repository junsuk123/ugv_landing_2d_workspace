  <text x="1180" y="650" text-anchor="middle" class="t b">6,101 parameters</text>
  <path d="M490 675 V740 H800" class="arr"/><path d="M1180 675 V740 H820" class="arr"/>
  <rect x="630" y="755" width="340" height="100" class="box"/>
  <text x="800" y="795" text-anchor="middle" class="t b">Direct [a<tspan baseline-shift="sub">x</tspan>, a<tspan baseline-shift="sub">z</tspan>]</text>
  <text x="800" y="830" text-anchor="middle" class="t s">Dynamics + mechanical touchdown</text>
  <text x="1190" y="815" class="t s" fill="#6d28d9">No raw bypass · no gate · no safety guard</text>
