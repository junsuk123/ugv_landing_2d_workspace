  <rect x="70" y="180" width="240" height="160" class="box"/>
  <text x="190" y="225" text-anchor="middle" class="t b">Sensors</text>
  <text x="190" y="265" text-anchor="middle" class="t s">Marker corners</text><text x="190" y="298" text-anchor="middle" class="t s">Navigation estimate</text>
  <rect x="385" y="180" width="250" height="160" class="box"/>
  <text x="510" y="225" text-anchor="middle" class="t b">Causal estimation</text>
  <text x="510" y="265" text-anchor="middle" class="t s">Planar PnP + CV-KF</text><text x="510" y="298" text-anchor="middle" class="t s">No hidden truth</text>
  <rect x="710" y="180" width="250" height="160" class="box"/>
  <text x="835" y="225" text-anchor="middle" class="t b">Common observation</text>
  <text x="835" y="270" text-anchor="middle" class="t s">o<tspan baseline-shift="sub">t</tspan> ∈ R¹²</text><text x="835" y="305" text-anchor="middle" class="t s">relative · motion · quality</text>
  <path d="M310 260 H375" class="arr"/><path d="M635 260 H700" class="arr"/>
  <path d="M835 340 V420 H490 V455" class="arr"/><path d="M835 340 V420 H1180 V455" class="arr"/>
  <rect x="250" y="455" width="480" height="220" class="box" stroke="#2563eb"/>
  <text x="490" y="505" text-anchor="middle" class="t b" fill="#1d4ed8">Plain PPO</text>
  <text x="490" y="550" text-anchor="middle" class="t s">12 → 48 → 48</text>
  <text x="490" y="590" text-anchor="middle" class="t s">Actor + Critic</text>
  <text x="490" y="635" text-anchor="middle" class="t b">6,101 parameters</text>
  <rect x="870" y="455" width="620" height="220" class="box" stroke="#6d28d9"/>
