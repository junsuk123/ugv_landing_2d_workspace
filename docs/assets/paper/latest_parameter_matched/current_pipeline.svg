<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2ff"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker>
    <style>.t{font-family:Arial,'Noto Sans KR',sans-serif;fill:#172033}.h{font-size:38px;font-weight:700}.s{font-size:22px}.b{font-size:25px;font-weight:700}.box{fill:white;stroke:#94a3b8;stroke-width:2;rx:20}.arr{stroke:#475569;stroke-width:4;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="80" y="75" class="t h">Current parameter-matched landing pipeline</text>
