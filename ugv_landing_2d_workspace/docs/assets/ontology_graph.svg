  <rect x="1100" y="763" width="22" height="18" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="1132" y="778" class="s">Safety</text>
  <text x="680" y="811" class="s">Node colour = readout group (mean-pooled, then W_g).</text>
  <text x="180" y="847" class="s">Self edges (relation "self") on all 9 nodes are omitted from the drawing; 26 directed edges in total, no symmetrization.</text>
