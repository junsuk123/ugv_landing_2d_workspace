  <rect x="70" y="225" width="230" height="90" class="n" fill="#dbeafe" stroke="#2563eb"/><text x="185" y="263" text-anchor="middle" class="t">PadMotion</text><text x="185" y="291" text-anchor="middle" class="s">v̂pad · âpad · uncertainty</text>
  <rect x="70" y="415" width="230" height="90" class="n" fill="#dcfce7" stroke="#16a34a"/><text x="185" y="453" text-anchor="middle" class="t">DroneTranslation</text><text x="185" y="481" text-anchor="middle" class="s">height · vx · vz</text>
