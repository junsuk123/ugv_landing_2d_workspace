    <style>.n{rx:14;stroke-width:2}.t{font:600 19px Arial,sans-serif;fill:#0f172a}.h{font:700 28px Arial,sans-serif;fill:#0f172a}.s{font:17px Arial,sans-serif;fill:#334155}.e{stroke:#475569;stroke-width:2.2;fill:none;marker-end:url(#a);opacity:.72}.v{stroke:#0891b2;stroke-width:2.6;stroke-dasharray:9 6;fill:none;marker-end:url(#v)}.p{stroke:#16a34a;stroke-width:3;fill:none;marker-end:url(#p)}.i{stroke:#dc2626;stroke-width:3.2;fill:none;marker-end:url(#r)} </style>
